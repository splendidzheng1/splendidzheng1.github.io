---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>

  {{ content }}

  {% if page.tags.size > 0 %}
  <hr style="margin-top: 2em; border-color: #333;">
  <div style="color: #888; font-size: 0.9em;">
    标签：
    {% for tag in page.tags %}
      <a href="/tags.html#{{ tag | slugify }}" style="color: #0f0; text-decoration: none; margin-right: 8px;">#{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}

  <p style="color: #666; font-size: 0.85em; margin-top: 1.5em;">发布于：{{ page.date | date: "%Y-%m-%d" }}</p>
</article>
