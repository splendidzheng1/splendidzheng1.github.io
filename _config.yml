title: Charles's Blogs
description: >-
  Charles 的个人博客，记录技术学习与投资研究。
  代码是自动化的 SOP，投资是认知的变现。
author: Charles
email: splendidzheng@163.com
lang: zh-CN
timezone: Asia/Shanghai

url: "https://splendidzheng1.github.io"
baseurl: ""

theme: jekyll-theme-hacker

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:title/

paginate: 10
paginate_path: "/page/:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
